name: Build & Release Windows Executable

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure offline MediaPipe models exist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          if (-not (Test-Path "models/hand_landmarker.task")) {
            Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" -OutFile "models/hand_landmarker.task"
          }
          if (-not (Test-Path "models/efficientdet_lite2.tflite")) {
            Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/int8/1/efficientdet_lite2.tflite" -OutFile "models/efficientdet_lite2.tflite"
          }
          if (-not (Test-Path "models/face_landmarker.task")) {
            Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" -OutFile "models/face_landmarker.task"
          }

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows portable app (onedir)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir `
            --name "Galilei_Di_Palo_AI_Lab" `
            --add-data "models;models" `
            --add-data "assets;assets" `
            --collect-all mediapipe `
            main.py

      - name: Add quick fullscreen launcher inside dist
        shell: pwsh
        run: |
          "@echo off`r`ncd /d `"%~dp0`"`r`nGalilei_Di_Palo_AI_Lab.exe --fullscreen`r`n" | Out-File -Encoding ascii "dist/Galilei_Di_Palo_AI_Lab/AVVIA_SCHERMO_INTERO.bat"

      - name: Package ZIP artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Galilei_Di_Palo_AI_Lab/*" -DestinationPath "Galilei_Di_Palo_AI_Lab_Windows.zip" -Force

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galilei_Di_Palo_AI_Lab_Windows
          path: Galilei_Di_Palo_AI_Lab_Windows.zip
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "latest" }
          $title = "IIS Galilei - Di Palo — AI Hand Lab ($tag)"
          $notes = @"
          ### Suite AI Interattiva per Orientamento — IIS "Galilei - Di Palo" (Salerno)

          **Come avviare su Windows (zero installazione Python richiesta):**
          1. Scarica ed estrai ``Galilei_Di_Palo_AI_Lab_Windows.zip``
          2. Fai doppio click su **``AVVIA_SCHERMO_INTERO.bat``** (oppure ``Galilei_Di_Palo_AI_Lab.exe``)

          **12 Modalità incluse (100% offline, navigazione stile Apple Vision Pro + Mouse):**
          - **Menu Home Olografico 4×3** (punta e fai PINCH oppure clicca col mouse!)
          - ``1`` **Cyber Slice** (Fruit Ninja a mani nude)
          - ``2`` **Morra AI** (Sasso-Carta-Forbici in loop automatico)
          - ``3`` **AI Music Studio** (DJ 4-Zone con 3 hit famose · Pianoforte Neon · Batteria Aerea)
          - ``4`` **Stark HUD** (Finestre olografiche stile Iron Man)
          - ``5`` **Conta Presenti** (Appello AI della classe)
          - ``6`` **Face Emoji & Photo Booth** (Emoji / Robot / Alieno fino a 4 volti + scatto foto ✌️!)
          - ``7`` **Neon Pong** (1 vs 1 con due ragazzi o 1 vs AI)
          - ``8`` **Superpoteri AR** (Kamehameha a 2 mani & Iron Man Repulsor)
          - ``9`` **Air Graffiti** (Lavagna neon in aria a 2 mani + gomma + salva)
          - ``10`` **Caccia agli Oggetti** (Sfida a tempo in classe su bottiglie, zaini, cellulari, libri...)
          - ``11`` **Neon Drive 3D** (Corsa auto 3D Synthwave guidata col volante a 2 mani!)
          - ``12`` **Labirinto 3D** (Esplorazione 3D Raycasting controllata con la mano!)
          "@

          $exists = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { $exists = $true }

          if ($exists) {
            gh release upload $tag "Galilei_Di_Palo_AI_Lab_Windows.zip" --clobber
            gh release edit $tag --title "$title" --notes "$notes" --latest
          } else {
            gh release create $tag "Galilei_Di_Palo_AI_Lab_Windows.zip" --title "$title" --notes "$notes" --latest
          }
